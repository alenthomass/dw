<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <!-- Hexagon Isometric Icon (DW Monogram) -->
  <g transform="translate(4, 2)" fill="#ffffff">
    <!-- Outer d-loop / Left Hex Edge -->
    <path d="M 22 2 L 26 2 L 26 14 L 32 17.5 L 32 23 L 26 19.5 L 26 31 L 18 36 L 4 28 L 4 19 L 18 27 L 22 24.5 Z"/>
    <path d="M 4 19 L 18 11 L 22 13.5 L 8 21.5 Z" opacity="0.85"/>
    
    <!-- Middle Ribbon (w first stem) -->
    <path d="M 30 11 L 34 8.5 L 42 13 L 42 22 L 30 29 L 26 26.5 L 36 20.5 L 36 14.5 L 30 11 Z" opacity="0.9"/>
    
    <!-- Inner / Base Ribbon (w second stem) -->
    <path d="M 22 36 L 36 28 L 40 30.5 L 22 41 L 12 35 L 14 31.5 Z" opacity="0.8"/>
    <path d="M 42 25 L 46 22.5 L 46 32 L 26 43.5 L 22 41 L 42 29.5 Z"/>
  </g>

  <!-- Typography -->
  <g transform="translate(60, 0)">
    <!-- DISPLAY WORLD -->
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="1.2" fill="#ffffff">DISPLAY WORLD</text>
    <!-- LET'S DO IT. -->
    <text x="2" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Outfit', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="rgba(255,255,255,0.75)" letter-spacing="4.5">LET'S DO IT.</text>
  </g>
</svg>